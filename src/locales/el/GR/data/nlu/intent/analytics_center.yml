version: "3.1"

nlu:
  - intent: list_hospitals
    examples: |
      - εμφάνισε νοσοκομεία
      - δείξε νοσοκομεία
      - ποια νοσοκομεία είναι διαθέσιμα;
      - εμφάνισε διαθέσιμους παρόχους
      - δείξε μου τη λίστα παρόχων
      - εμφάνισε νοσοκομεία για σύγκριση
      - δώσε μου τη λίστα νοσοκομείων
      - δείξε διαθέσιμα νοσοκομεία
      - εμφάνισε νοσοκομεία που βρίσκονται στην [Ισπανία](country_code)
      - διαθέσιμα νοσοκομεία για [Μεξικό](country_code)
      - εμφάνισε νοσοκομεία για χώρα [DE](country_code)
      - δείξε τα επόμενα [15](limit) νοσοκομεία στην [IT](country_code)
      - εμφάνισε νοσοκομεία στις [US](country_code)
      - δείξε νοσοκομεία στις [Ηνωμένες Πολιτείες](country_code)
      - εμφάνισε νοσοκομεία στον [Καναδά](country_code)
      - δείξε νοσοκομεία στο [Ηνωμένο Βασίλειο](country_code)
      - εμφάνισε νοσοκομεία στην [Αυστραλία](country_code)
      - δείξε νοσοκομεία στη [Γερμανία](country_code)
      - εμφάνισε νοσοκομεία στη [Γαλλία](country_code)
      - δείξε νοσοκομεία στην [Ισπανία](country_code)
      - εμφάνισε νοσοκομεία στο [Μεξικό](country_code)
      - δείξε νοσοκομεία στην [Ιαπωνία](country_code)
      - δείξε νοσοκομεία στην [Ισπανία](country_code) ταξινομημένα κατά [name](sort)
      - εμφάνισε νοσοκομεία στο [Μεξικό](country_code) ταξινομημένα κατά [created_at](sort)
      - εμφάνισε νοσοκομεία με όνομα [General](hospital_name)
      - δείξε νοσοκομεία με όνομα [Memorial](hospital_name)
      - βρες νοσοκομεία που περιέχουν [Saint](hospital_name)
      - εμφάνισε νοσοκομεία που ταιριάζουν με [Children](hospital_name)
      - δείξε νοσοκομεία με όνομα [Central](hospital_name)
      - εμφάνισε νοσοκομεία, όριο [10](limit)
      - δείξε νοσοκομεία, όριο [25](limit)
      - εμφάνισε νοσοκομεία, μετατόπιση [0](offset)
      - δείξε νοσοκομεία, μετατόπιση [50](offset)
      - εμφάνισε νοσοκομεία στις [US](country_code) με όριο [20](limit)
      - δείξε νοσοκομεία στις [US](country_code) με μετατόπιση [40](offset)
      - εμφάνισε νοσοκομεία στις [US](country_code) με όριο [20](limit) και μετατόπιση [0](offset)
      - δείξε νοσοκομεία στον [Καναδά](country_code) με όριο [50](limit) και μετατόπιση [50](offset)
      - δείξε τα επόμενα [20](limit) νοσοκομεία στην [ES](country_code)
      - δείξε τα επόμενα [10](limit) νοσοκομεία με μετατόπιση [20](offset)
      - εμφάνισε νοσοκομεία με μετατόπιση [100](offset) και όριο [20](limit)
      - εμφάνισε νοσοκομεία ταξινομημένα κατά [name](sort)
      - δείξε νοσοκομεία ταξινομημένα κατά [created_at](sort)
      - εμφάνισε νοσοκομεία για ομάδα [10](group_id)
      - δείξε νοσοκομεία για ομάδα [25](group_id)

  # country_code lookup/synonym data is generated from SSOT/CountryType.yml by
  # OverlayImporter -- see src/components/layered_importer.py.

  - regex: limit
    examples: |
      - \b(?:[1-9]\d{0,2})\b

  - regex: offset
    examples: |
      - \b(?:0|[1-9]\d{0,4})\b
