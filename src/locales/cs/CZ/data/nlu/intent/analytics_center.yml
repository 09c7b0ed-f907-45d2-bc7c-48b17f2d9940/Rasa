      - vypiš nemocnice seřazené podle [name](sort) s limitem [10](limit)
      - ukaž nemocnice pro skupinu [10](group_id) seřazené podle [created_at](sort)

  # country_code lookup/synonym data is generated from SSOT/CountryType.yml by
  # OverlayImporter -- see src/components/layered_importer.py.

  - regex: limit
    examples: |
      - \b(?:[1-9]\d{0,2})\b

  - regex: offset
    examples: |
      - \b(?:0|[1-9]\d{0,4})\b
