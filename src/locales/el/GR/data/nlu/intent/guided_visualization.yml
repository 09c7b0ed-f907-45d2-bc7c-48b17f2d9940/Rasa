version: "3.1"

nlu:
  - intent: request_guided_visualization
    examples: |
      - ναι
      - ναι παρακαλώ
      - βεβαίως
      - εντάξει
      - πάμε
      - βοήθησέ με να φτιάξω ένα γράφημα
      - καθοδήγησέ με για να δημιουργήσω ένα γράφημα
      - δείξε μου τη διαδικασία βήμα βήμα
      - βοήθησέ με να φτιάξω μια οπτικοποίηση
      - μπορείς να με καθοδηγήσεις βήμα βήμα

  - intent: request_freeform_visualization
    examples: |
      - θα το περιγράψω μόνος μου
      - άσε με να γράψω το αίτημα
      - θέλω να το κάνω ελεύθερα
      - θα σου πω απλώς τι θέλω
      - θα το γράψω σε ένα μήνυμα

  - intent: cancel_guided_visualization
    examples: |
      - άλλαξε σε ελεύθερη λειτουργία
      - άλλαξε σε λειτουργία ενός μηνύματος
      - βγες από την καθοδηγούμενη λειτουργία
      - σταμάτα την καθοδηγούμενη λειτουργία
      - ακύρωσε την καθοδηγούμενη ροή
      - ακύρωσε τον καθοδηγούμενο τρόπο
      - τερμάτισε την καθοδηγούμενη λειτουργία

  - intent: provide_guided_hospital_scope
    examples: |
      - χρησιμοποίησε [US](country_code)
      - [Ηνωμένες Πολιτείες](country_code)
      - [ES](country_code)
      - [Ισπανία](country_code)
      - [Μεξικό](country_code)
      - χρησιμοποίησε το νοσοκομείο [Memorial](hospital_name)
      - [General](hospital_name)
      - ομάδα νοσοκομείων [10](group_id)
      - ομάδα [25](group_id)
      - [όλα τα νοσοκομεία](hospital_scope_reference)
      - [όλα](hospital_scope_reference)
      - [το νοσοκομείο μου](hospital_scope_reference)
      - [δικό μου](hospital_scope_reference)
      - [δικό μας](hospital_scope_reference)
      - [το νοσοκομείο μας](hospital_scope_reference)

  - intent: skip_guided_step
    examples: |
      - παράλειψη
      - παράλειψέ το
      - επόμενο
      - συνέχισε
      - προχώρα
      - όχι
      - όχι ευχαριστώ
      - όχι τώρα
      - μπα
      - ε όχι
      - ίσως αργότερα
      - χωρίς φίλτρο
      - κανένα
      - άφησέ το κενό
