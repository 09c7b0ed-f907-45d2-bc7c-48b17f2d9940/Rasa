version: "3.1"

nlu:
  - intent: generate_visualization
    examples: |
      - Show me [door to needle](metric) and [DIDO](metric) scores
      - I want [NIHSS](metric) for all patients
      - Give me [AdmissionNihss](metric) and [DischargeNihss](metric)
      - Show me [DTN](metric) for [male](sex) patients
      - Chart of [DIDO](metric) in [female](sex) stroke patients
      - Give me [NIHSS](metric) data for [men](sex) and [women](sex) patients
      - Show me [door to needle time](metric) for patients aged [50]{"entity": "age", "role": "lower"} to [90]{"entity": "age", "role": "upper"}
      - Give me [door in door out](metric) between ages [30]{"entity": "age", "role": "lower"} and [50]{"entity": "age", "role": "upper"}
      - Display [AdmissionNihss](metric) for patients aged from [60]{"entity": "age", "role": "lower"} to [80]{"entity": "age", "role": "upper"}
      - Show me [DTN](metric) for patients above [50]{"entity": "age", "role": "lower"}
      - Give me [door in door out time](metric) for patients over [65]{"entity": "age", "role": "lower"} years old
      - Display data for patients under [30]{"entity": "age", "role": "upper"} years
      - Show patients aged [18]{"entity": "age", "role": "lower"} and above
      - Chart for patients below [90]{"entity": "age", "role": "upper"}
      - Chart of [DTN](metric) grouped by [initial point of contact](group_by)
      - Show [DIDO](metric) by [hospital department](group_by)
      - Give me average [NIHSS](metric) grouped by [EMS prenotification](group_by)
      - Show [DTN](metric) excluding [ischaemic](stroke_type) stroke patients
      - Chart [DIDO](metric) for [haemorrhagic](stroke_type) strokes
      - Give me [NIHSS](metric) scores excluding [TIA](stroke_type) patients
      - Show [DTN](metric) between [4 March 2023]{"entity": "date", "role": "lower"} and [5 July 2024]{"entity": "date", "role": "upper"}
      - Chart [DIDO](metric) from [1 January 2022]{"entity": "date", "role": "lower"} to [31 December 2022]{"entity": "date", "role": "upper"}
      - Show data after [2023-01-01]{"entity": "date", "role": "lower"}
      - Display records before [2024-12-31]{"entity": "date", "role": "upper"}
      - Give me data from [Q1 2023]{"entity": "date", "role": "lower"} onwards
      - Show recent data since [last month]{"entity": "date", "role": "lower"}
      - Show a [line](chart_type) graph of [DTN](metric)
      - Show [SEX](metric) as [percent]{"entity": "kpi", "value": "percent"} in a [bar](chart_type) chart
      - Give me [STROKE TYPE](metric) in [percentage]{"entity": "kpi", "value": "percent"} using a [line](chart_type) chart
      - Display [Hospitalized in](metric) as [per cent]{"entity": "kpi", "value": "percent"}
      - Give me a [bar](chart_type) chart of [DIDO](metric) for [female](sex) patients
      - Show me patient [sex](metric) in a [bar](chart_type) chart grouped by [quarter](group_by)
      - Show me patient [stroke type](metric) in a [bar](chart_type) chart grouped by [quarter](group_by)
      - Display a [pie](chart_type) chart of [NIHSS](metric) grouped by [stroke type](group_by)
      - Show a [line](chart_type) graph for [DTN](metric) and [DIDO](metric) for [male](sex) and [female](sex) patients between [40]{"entity": "age", "role": "lower"} and [60]{"entity": "age", "role": "upper"}
      - Give me a chart of [age](metric) of patients grouped by [initial point of contact](group_by), excluding [ischaemic](stroke_type) strokes, between ages [18]{"entity": "age", "role": "lower"} to [90]{"entity": "age", "role": "upper"}
      - Can you show [LOS](metric) for [ischaemic](stroke_type) stroke patients?
      - Display [DischargeNihss](metric) scores grouped by [treatment type](group_by)
      - I need a [scatter](chart_type) plot of [DTN](metric) vs [DIDO](metric)
      - Show me [mortality rate](metric) for patients aged [65]{"entity": "age", "role": "lower"} and above
      - Chart [readmission rate](metric) by [stroke subtype](group_by) for [female](sex) patients
      - Give me [mRS](metric) scores for [haemorrhagic](stroke_type) strokes from [2023-01-01]{"entity": "date", "role": "lower"} to [2023-12-31]{"entity": "date", "role": "upper"}
      - Display a [histogram](chart_type) of [age](metric) distribution
      - Show [thrombolysis rate](metric) grouped by [arrival method](group_by)
      - I want to see [NIHSS](metric) improvement between [admission]{"entity": "nihss", "role": "lower"} and [discharge]{"entity": "nihss", "role": "upper"}
      - Chart [DTN](metric) performance by [month](group_by) in a [line](chart_type) graph
      - Show [complications rate](metric) for [male](sex) patients with [TIA](stroke_type)
      - Display [door to imaging](metric) times for urgent cases
      - Give me [LOS](metric) statistics for patients aged [18]{"entity": "age", "role": "lower"} to [45]{"entity": "age", "role": "upper"}
      - Show a [box plot](chart_type) of [DIDO](metric) by [severity level](group_by)
      - Chart [functional outcome](metric) for [ischaemic](stroke_type) patients by [sex](group_by)
      - I need [DTN](metric) trends over the past year
      - Display [medication compliance](metric) rates by [age group](group_by)
      - Show [emergency response time](metric) for [haemorrhagic](stroke_type) cases
      - Give me a [radar](chart_type) chart of multiple [KPIs](metric) by [hospital unit](group_by)
      - Chart [NIHSS](metric) distribution from [Q1 2023]{"entity": "date", "role": "lower"} to [Q4 2023]{"entity": "date", "role": "upper"}
      - Show NIHSS scores ranging from [0]{"entity": "nihss", "role": "lower"} to [15]{"entity": "nihss", "role": "upper"}
      - Display NIHSS changes between [5]{"entity": "nihss", "role": "lower"} and [25]{"entity": "nihss", "role": "upper"}
      - Chart NIHSS progression from [8]{"entity": "nihss", "role": "lower"} to [20]{"entity": "nihss", "role": "upper"} severity
      - Give me NIHSS trends from [12]{"entity": "nihss", "role": "lower"} to [22]{"entity": "nihss", "role": "upper"}
      - Show patients with NIHSS above [15]{"entity": "nihss", "role": "lower"}
      - Display mild strokes with NIHSS below [5]{"entity": "nihss", "role": "upper"}
      - Chart severe cases with NIHSS over [20]{"entity": "nihss", "role": "lower"}
      - Show NIHSS improvements above [10]{"entity": "nihss", "role": "lower"} points
      - Compare [DTN](metric) and [DIDO](metric) scores
      - Show [mortality rate](metric) and [readmission rate](metric) together
      - Display [AdmissionNihss](metric) vs [DischargeNihss](metric) scores
      - Chart [male](sex) and [female](sex) patient outcomes
      - Compare [ischaemic](stroke_type) and [haemorrhagic](stroke_type) stroke data
      - Show [DTN](metric) and [DIDO](metric) and [door to imaging](metric) times
      - Compare my hospital's [DTN](metric) to the national mean in the UK
      - Compare [DTN](metric) for my hospital against the UK national mean
      - Show a [line](chart_type) graph of [DTN](metric) for my hospital vs UK national mean
      - Run a Mann Whitney test comparing my hospital [DTN](metric) to the national mean
      - Generate a test to compare my hospital [DTN](metric) to the national mean with Mann Whitney
      - Perform a Mann-Whitney U test for [DTN](metric) between my hospital and the national mean
      - Compare my hospital [DTN](metric) with the UK national average using Mann Whitney
      - Display data from [Q1 2023]{"entity": "date", "role": "lower"} to [Q2 2023]{"entity": "date", "role": "upper"} vs [Q3 2023]{"entity": "date", "role": "lower"} to [Q4 2023]{"entity": "date", "role": "upper"}
      - Compare patients aged [30]{"entity": "age", "role": "lower"} to [45]{"entity": "age", "role": "upper"} with those aged [60]{"entity": "age", "role": "lower"} to [80]{"entity": "age", "role": "upper"}
      - Show me a line chart of [dtn](metric) grouped by [inr measurement mode](group_by)
      - Make me a bar chart of [physiotherapy received](metric) grouped by [stroke type](group_by)

  - intent: update_visualization
    examples: |
      - Change the chart to a [bar](chart_type) graph
      - Update to show [female](sex) patients only
      - Modify the date range to [2023]{"entity": "date", "role": "lower"} to [2024]{"entity": "date", "role": "upper"}
      - Switch to [haemorrhagic](stroke_type) stroke type
      - Group the data by [treatment facility](group_by)
      - Add [DIDO](metric) to the current visualisation
      - Remove [male](sex) patients from the chart
      - Change age range to [55]{"entity": "age", "role": "lower"} to [75]{"entity": "age", "role": "upper"}
      - Update chart type to [pie](chart_type)
      - Filter for [ischaemic](stroke_type) strokes only
      - Modify grouping to [admission source](group_by)
      - Group the data by [stroke type](group_by)
      - Also group the data by [sex](group_by)
      - Group by [quarter](group_by)
      - Change grouping to [quarters](group_by)
      - Change KPI to [AdmissionNihss](metric)
      - Set KPI to [percent]{"entity": "kpi", "value": "percent"}
      - Update date filter to last [6 months]{"entity": "date", "role": "lower"}
      - Switch to [scatter](chart_type) plot visualisation
      - Add [TIA](stroke_type) patients to the analysis
      - Show only patients above [70]{"entity": "age", "role": "lower"}
      - Filter dates after [2024-01-01]{"entity": "date", "role": "lower"}
  - intent: clarify_visualization
    examples: |
      - [DTN](metric)
      - [swallowing screening performed](metric)
      - Use [DIDO](metric)
      - [NIHSS](metric), please
      - For [last month](date)
      - From [1 January 2024]{"entity": "date", "role": "lower"} to [31 March 2024]{"entity": "date", "role": "upper"}
      - [line](chart_type)
      - make it [bar](chart_type)
      - group by [stroke type](group_by)
      - for [female](sex) patients
      - [ischaemic](stroke_type)
      - The metric is [door to needle](metric)
      - By [month](group_by)
      - Time window is [Q1 2025](date)
      - Use [admission nihss](metric)
      - [percent]{"entity": "kpi", "value": "percent"}
      - [this year](date)

